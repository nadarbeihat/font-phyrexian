name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o PhyrexianKeyboard.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Gradle wrapper
        run: cd PhyrexianKeyboard && gradle wrapper --gradle-version 8.6

      - name: Build debug APK
        run: cd PhyrexianKeyboard && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhyrexianKeyboard-apk
          path: PhyrexianKeyboard/app/build/outputs/apk/debug/app-debug.apk
